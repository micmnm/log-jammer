services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: logjammer
      POSTGRES_USER: logjammer
      POSTGRES_PASSWORD: logjammer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logjammer -d logjammer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./src
      dockerfile: LogJammer.Api/Dockerfile
    ports:
      - "5050:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=logjammer;Username=logjammer;Password=logjammer"
      Authentication__Username: "admin"
      Authentication__Password: "changeme"
      Authentication__ApiToken: "change-this-to-a-random-string"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  models:
