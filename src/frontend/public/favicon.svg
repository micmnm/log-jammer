<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: dark rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#171d25"/>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="none" stroke="#2a6cb3" stroke-width="1.5"/>

  <!-- Log lines (faded, representing log entries) -->
  <line x1="16" y1="20" x2="36" y2="20" stroke="#3a4555" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="42" y2="28" stroke="#3a4555" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="36" x2="32" y2="36" stroke="#3a4555" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="44" x2="40" y2="44" stroke="#3a4555" stroke-width="3" stroke-linecap="round"/>

  <!-- Signal pulse line (the "jammer" detection) -->
  <polyline
    points="12,36 22,36 26,18 30,50 34,28 38,42 42,32 48,32 52,32"
    fill="none"
    stroke="#5c9ce6"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Alert dot -->
  <circle cx="50" cy="16" r="5" fill="#e6825c"/>
</svg>
