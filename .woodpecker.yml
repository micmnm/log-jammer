# =============================================================================
# Woodpecker CI Pipeline for Log Jammer
# =============================================================================
# Branch: main - Build, push Docker image to GHCR, auto-deploy to LKE
# =============================================================================

when:
  branch: [main, master]
  event: [push, manual]

variables:
  - &dotnet_image mcr.microsoft.com/dotnet/sdk:10.0
  - &docker_image docker:24
  - &kubectl_image alpine/k8s:1.29.0
  - &image_repo ghcr.io/micmnm/log-jammer

steps:
  # ---------------------------------------------------------------------------
  # Build and verify
  # ---------------------------------------------------------------------------
  build:
    image: *dotnet_image
    commands:
      - dotnet build src/LogJammer.slnx

  # ---------------------------------------------------------------------------
  # Build and push Docker image to GHCR
  # ---------------------------------------------------------------------------
  docker:
    image: *docker_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GHCR_USER:
        from_secret: ghcr_user
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - docker build -t "ghcr.io/micmnm/log-jammer:$(date +%Y%m%d)-${CI_PIPELINE_NUMBER}" -t "ghcr.io/micmnm/log-jammer:latest" -f src/LogJammer.Api/Dockerfile src/
      - docker push "ghcr.io/micmnm/log-jammer:$(date +%Y%m%d)-${CI_PIPELINE_NUMBER}"
      - docker push "ghcr.io/micmnm/log-jammer:latest"
    depends_on: [build]

  # ---------------------------------------------------------------------------
  # Deploy to LKE
  # ---------------------------------------------------------------------------
  deploy:
    image: *kubectl_image
    environment:
      HOME: /tmp
      KUBECONFIG_SECRET:
        from_secret: kubeconfig
    commands:
      - mkdir -p /tmp/.kube
      - echo "$KUBECONFIG_SECRET" > /tmp/.kube/config
      - chmod 600 /tmp/.kube/config
      - kubectl --kubeconfig=/tmp/.kube/config set image deployment/log-jammer api="ghcr.io/micmnm/log-jammer:$(date +%Y%m%d)-${CI_PIPELINE_NUMBER}" -n log-jammer
      - kubectl --kubeconfig=/tmp/.kube/config rollout status deployment/log-jammer -n log-jammer --timeout=120s
    depends_on: [docker]

# =============================================================================
# Required Secrets (configure in Woodpecker UI)
# =============================================================================
# ghcr_user   - GitHub username (owner of the GHCR package)
# ghcr_token  - GitHub PAT with write:packages scope
# kubeconfig  - Kubeconfig for LKE cluster
#
# Cluster prerequisites (per namespace where the deployment lives):
#   kubectl --context lke560125-ctx -n log-jammer create secret docker-registry \
#     registry-credentials \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user> \
#     --docker-password=<github-pat>
# =============================================================================
